name: Zkušební hra se skutečným modelem

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: "Scénáře oddělené čárkou (quest,campaign,realm,endless); prázdné = všechny"
        required: false
        default: "quest,campaign"

permissions:
  contents: write

jobs:
  play:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XC/Contents/Developer"
          swift --version
      - name: Model z mezipaměti
        id: cache
        uses: actions/cache@v4
        with:
          path: model
          key: gemma-3-4b-it-q4km-4996030242583a40
      - name: Stažení modelu (Hugging Face, ověření SHA-256)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p model
          curl -fL --retry 4 -o model/m.gguf "https://huggingface.co/bartowski/google_gemma-3-4b-it-GGUF/resolve/main/google_gemma-3-4b-it-Q4_K_M.gguf"
      - name: Kontrolní součet
        run: echo "4996030242583a40aa151ff93f49ed787ac8c25e4120c3ae4588b2e2a7d1ae94  model/m.gguf" | shasum -a 256 -c
      - name: Sestavení
        working-directory: tools/playtest
        run: swift build -c release 2>&1 | tail -30
      - name: Hra (CPU – Metal ve virtuálním Macu je velmi pomalý)
        run: |
          mkdir -p out
          sysctl -n hw.ncpu hw.memsize
          tools/playtest/.build/release/playtest model/m.gguf out/playtest.md 0 "${{ inputs.scenarios }}" || echo "::warning::hra hlásí chyby"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playtest
          path: out/
      - name: Záznam do větve playtest
        if: always()
        run: |
          cp -R out /tmp/out
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan playtest
          git rm -rfq .
          rm -rf model tools/playtest/.build out
          cp /tmp/out/*.md .
          git add *.md
          git commit -qm "Zkušební hra ${GITHUB_SHA::7}"
          git push -f origin playtest
