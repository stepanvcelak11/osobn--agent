name: SDK – výpis rozhraní (pomocný)

on:
  workflow_dispatch:
    inputs:
      frameworks:
        description: "Frameworky oddělené mezerou"
        default: "AlarmKit"

jobs:
  dump:
    runs-on: macos-15
    steps:
      - name: Výpis .swiftinterface
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          SDK="$XC/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk"
          for fw in ${{ inputs.frameworks }}; do
            f=$(find "$SDK/System/Library/Frameworks/$fw.framework" -name 'arm64e-apple-ios.swiftinterface' | head -1)
            echo "===== $fw: $f"
            grep -v '^\s*$' "$f" | grep -vE '^\s*//' | head -1500
          done
