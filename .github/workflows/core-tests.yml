name: Jádro – testy (Linux)

on:
  push:
    branches: [main]
    paths: ["Packages/RealmCore/**", "tools/**", ".github/workflows/core-tests.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: Packages/RealmCore
        run: |
          swift test 2>&1 | tee test.log
          grep -E "Executed .* tests, with 0 failures" test.log
