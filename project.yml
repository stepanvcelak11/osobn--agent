# Projekt Xcode se generuje nástrojem XcodeGen (brew install xcodegen; xcodegen generate)
name: PocketRealm
options:
  bundleIdPrefix: cz.pocketrealm
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: cs
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  RealmCore:
    path: Packages/RealmCore
  LlamaKit:
    path: Packages/LlamaKit
  WhisperBridge:
    path: Packages/WhisperBridge
targets:
  PocketRealm:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: RealmCore
      - package: LlamaKit
      - package: WhisperBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.pocketrealm.app
        PRODUCT_NAME: PocketRealm
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
schemes:
  PocketRealm:
    build:
      targets:
        PocketRealm: all
    archive:
      config: Release
