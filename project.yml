# Projekt Xcode se generuje nástrojem XcodeGen (brew install xcodegen; xcodegen generate)
name: OsobniAgent
options:
  bundleIdPrefix: cz.osobniagent
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: cs
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  AgentCore:
    path: Packages/AgentCore
  LlamaKit:
    path: Packages/LlamaKit
  WhisperBridge:
    path: Packages/WhisperBridge
targets:
  OsobniAgent:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: AgentCore
      - package: LlamaKit
      - package: WhisperBridge
      - target: QuickCaptureWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.osobniagent.app
        PRODUCT_NAME: OsobniAgent
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
  QuickCaptureWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.osobniagent.app.capture
        PRODUCT_NAME: QuickCaptureWidget
        INFOPLIST_FILE: Widget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
schemes:
  OsobniAgent:
    build:
      targets:
        OsobniAgent: all
    archive:
      config: Release
